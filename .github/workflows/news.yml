name: Новини кіно
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/news.py', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Зібрати новини
        run: python3 scripts/news.py "$RUNNER_TEMP/news.json"
      - name: Опублікувати в гілку news-data
        run: |
          cd "$RUNNER_TEMP" && mkdir pub && cd pub
          git init -q -b news-data
          cp ../news.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json && git commit -q -m "Новини кіно"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-data
